name: Sincronizar planilha editável

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-sheet-sync.yml"

permissions:
  contents: read

concurrency:
  group: sync-planilha-editavel
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar sincronização planilha e Supabase
        shell: bash
        run: |
          URL="https://script.google.com/macros/s/AKfycby-E-1j5rfU1eAMWX-5APMTMCK7C_0muyeV4FdM8JlbHTxKL47lqimoVlyuHdV0vcU4/exec?syncNow=1"
          curl -L --silent --show-error --max-time 70 "$URL" || true
          echo "Sincronização disparada."
