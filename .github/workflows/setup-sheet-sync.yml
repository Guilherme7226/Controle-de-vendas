name: Sincronizar planilha editável

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/setup-sheet-sync.yml"

permissions:
  contents: read

concurrency:
  group: sync-planilha-editavel
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar planilha e Supabase
        shell: bash
        run: |
          set -euo pipefail
          URL="https://script.google.com/macros/s/AKfycby-E-1j5rfU1eAMWX-5APMTMCK7C_0muyeV4FdM8JlbHTxKL47lqimoVlyuHdV0vcU4/exec?syncNow=1"
          BODY="$(curl -L --fail --silent --show-error "$URL")"
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
