name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
      - v2-supabase
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar configuração do Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "ERRO: secret CLOUDFLARE_API_TOKEN não está configurado." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "ERRO: secret CLOUDFLARE_ACCOUNT_ID não está configurado." && exit 1)
          echo "Secrets do Cloudflare encontrados."

      - name: Instalar Wrangler
        run: npm install --global wrangler@4

      - name: Testar autenticação do Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler whoami

      - name: Validar configuração do Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --dry-run --config wrangler.toml

      - name: Publicar Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy --config wrangler.toml

      - name: Verificar V2 no endereço oficial
        run: |
          sleep 3
          curl -fsSL -H 'Cache-Control: no-cache' 'https://paozinhos.mgpz.workers.dev/?verify=v2' -o /tmp/home.html
          head -n 40 /tmp/home.html
          grep -F 'Bem-vindo ao Pãozinhos' /tmp/home.html
