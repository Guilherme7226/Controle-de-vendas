<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paozinhos</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#fff7ed,#fef3c7);
  color:#292524;
}
.card{
  width:min(92%,430px);
  background:#fff;
  border:1px solid #e7e5e4;
  border-radius:24px;
  padding:42px 32px;
  text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.10);
}
.logo{font-size:58px;margin-bottom:8px}
h1{margin:0;font-size:34px}
p{color:#78716c;line-height:1.5;margin:12px 0 28px}
button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px 20px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:#ea580c;
  color:white;
}
button:hover{filter:brightness(.95)}
small{display:block;margin-top:22px;color:#a8a29e}
</style>
</head>
<body>
<main class="card">
  <div class="logo">🥖</div>
  <h1>Paozinhos</h1>
  <p>Controle de vendas, recebimentos e custos.</p>
  <button onclick="location.href='/'">Entrar no sistema</button>
  <small>Página de entrada • versão de teste</small>
</main>
</body>
</html>
